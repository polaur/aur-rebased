# This config file controls the automation provided by dracut-cachyos

# When DRACUT_QUIET is set to true, dracut will operate with quiet flag set suppressing most output
#DRACUT_QUIET="false"

# When NO_FALLBACK is set to true, no fallback initrd will be generated
#NO_DRACUT_FALLBACK="false"

# When BUILD_UKI is set to true, an UKI will be generated and placed in: /boot/EFI/Linux/
#BUILD_UKI="false"

# When NVIDIA_EARLY_KMS is set to true, the NVIDIA modules (nvidia, nvidia_modeset,
# nvidia_uvm, nvidia_drm) are included in every initramfs and UKI for kernels that
# have them installed, e.g. built by nvidia-open-dkms. Kernels without the modules
# are built as usual. Enables early KMS at the cost of a larger initramfs.
# Calamares enables this in the installed system after checking the NVIDIA
# hardware, driver packages, and modules for the target kernel. Keep the image
# default disabled. The Devario Limine boot builder honors this flag for normal
# and fallback images, requires all four modules, and requests early loading.
# UKI generation above belongs to the legacy dracut wrapper, not the Limine path.
#NVIDIA_EARLY_KMS="false"

# When AMD_EARLY_KMS is set to true, the amdgpu module is included in every
# initramfs and UKI for kernels that ship it. Enables early KMS for AMD GPUs and
# APUs at the cost of a larger initramfs (amdgpu pulls in its firmware).
#AMD_EARLY_KMS="false"

# When INTEL_EARLY_KMS is set to true, the Intel i915 and xe modules are included
# in every initramfs and UKI for kernels that ship them; whichever of the two the
# kernel lacks is skipped. Enables early KMS for Intel GPUs at the cost of a
# larger initramfs.
# NVIDIA, AMD and Intel flags combine, e.g. for hybrid laptops. The note above
# about the Devario Limine boot builder applies to NVIDIA_EARLY_KMS only; the
# builder must learn AMD_EARLY_KMS and INTEL_EARLY_KMS separately.
#INTEL_EARLY_KMS="false"
